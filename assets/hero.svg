<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0A0F24" />
      <stop offset="100%" stop-color="#070A17" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FF2A5F;#00F0FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#9333EA;#3B82F6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF2A5F">
        <animate attributeName="stop-color" values="#FF2A5F;#00F0FF;#FF2A5F" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF2A5F" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.35" />
      <circle cx="30" cy="0" r="1" fill="#00F0FF" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(240px); opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .status-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 32px 36px;
    }
    .scan-bar {
      animation: scanLine 7s linear infinite;
    }
    .cursor {
      animation: cursorBlink 1s infinite;
    }
    .flow-line {
      stroke-dasharray: 20, 10;
      animation: circuitFlow 4s linear infinite;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .sans-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="256" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.75" />
  <rect x="3" y="3" width="954" height="254" rx="13" fill="url(#grid)" />

  <!-- Scanline sweep -->
  <line x1="10" y1="10" x2="950" y2="10" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.4" class="scan-bar" />

  <!-- Decorative Circuit Traces in Corners -->
  <path d="M 820 20 L 920 20 L 940 40 L 940 90" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.3" class="flow-line" />
  <path d="M 20 200 L 20 230 L 50 240 L 160 240" fill="none" stroke="#FF2A5F" stroke-width="1" opacity="0.3" class="flow-line" />

  <!-- Top System Bar -->
  <g class="mono-text" font-size="11">
    <rect x="24" y="28" width="14" height="14" rx="3" fill="#1E293B" stroke="#00F0FF" stroke-width="0.8" opacity="0.8" />
    <circle cx="31" cy="35" r="3.5" fill="#00F0FF" class="status-dot" />

    <text x="48" y="39" fill="#00F0FF" font-weight="700" letter-spacing="1">SYSTEM://ONLINE</text>
    <text x="180" y="39" fill="#64748B" font-weight="400">|</text>
    <text x="195" y="39" fill="#94A3B8" letter-spacing="0.5">LOCATION: <tspan fill="#F8FAFC" font-weight="600">INDIA</tspan></text>
    <text x="325" y="39" fill="#64748B" font-weight="400">|</text>
    <text x="340" y="39" fill="#94A3B8" letter-spacing="0.5">ROLE: <tspan fill="#FF2A5F" font-weight="600">FULL STACK &amp; BACKEND</tspan></text>

    <!-- Top Right Stats -->
    <rect x="790" y="26" width="146" height="22" rx="4" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
    <circle cx="804" cy="37" r="3" fill="#10B981" />
    <text x="814" y="38" fill="#E2E8F0" font-size="10" font-weight="600" letter-spacing="0.5">NODE: ASIA-SOUTH</text>
    <text x="918" y="38" fill="#00F0FF" font-size="10" font-weight="700">OK</text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="20" y1="56" x2="940" y2="56" stroke="#1E293B" stroke-width="1" opacity="0.6" />

  <!-- Main Hero Content -->
  <!-- Tagline Badge -->
  <g transform="translate(36, 80)">
    <rect x="0" y="0" width="375" height="24" rx="12" fill="#0E172E" stroke="#00F0FF" stroke-width="0.9" opacity="0.95" />
    <text x="14" y="16" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="1.2" class="mono-text">
      &gt; FULL STACK DEV // BACKEND ENTHUSIAST
    </text>
    <circle cx="360" cy="12" r="3" fill="#FF2A5F" />
  </g>

  <!-- Name Header -->
  <text x="36" y="152" fill="url(#textGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" class="sans-text" filter="url(#glow)">
    SHIVA PATHAK
  </text>

  <!-- Role Subheading with Cursor -->
  <g transform="translate(38, 185)" class="mono-text">
    <text x="0" y="0" fill="#94A3B8" font-size="14.5" font-weight="500" letter-spacing="0.4">
      Building Robust, Scalable &amp; Efficient End-to-End Applications
    </text>
    <rect x="585" y="-12" width="9" height="15" fill="#00F0FF" class="cursor" />
  </g>

  <!-- Bottom Badges / Micro Telemetry -->
  <g transform="translate(36, 212)" class="mono-text" font-size="11">
    <!-- Badge 1: Core -->
    <rect x="0" y="0" width="145" height="24" rx="4" fill="#0A1124" stroke="#00F0FF" stroke-width="0.8" opacity="0.8" />
    <text x="10" y="16" fill="#64748B">CORE:</text>
    <text x="52" y="16" fill="#F8FAFC" font-weight="600">NODE &amp; JAVA</text>

    <!-- Badge 2: Data -->
    <rect x="155" y="0" width="185" height="24" rx="4" fill="#0A1124" stroke="#1E293B" stroke-width="0.8" />
    <text x="165" y="16" fill="#64748B">DATA:</text>
    <text x="208" y="16" fill="#38BDF8" font-weight="600">MONGO &amp; MYSQL</text>

    <!-- Badge 3: Target -->
    <rect x="350" y="0" width="195" height="24" rx="4" fill="#0A1124" stroke="#FF2A5F" stroke-width="0.8" opacity="0.8" />
    <text x="360" y="16" fill="#64748B">TARGET:</text>
    <text x="418" y="16" fill="#FF2A5F" font-weight="600">SYSTEM SCALE &amp; AI</text>

    <!-- Badge 4: Status -->
    <rect x="555" y="0" width="170" height="24" rx="4" fill="#0A1124" stroke="#10B981" stroke-width="0.8" opacity="0.8" />
    <text x="565" y="16" fill="#64748B">STATUS:</text>
    <text x="620" y="16" fill="#10B981" font-weight="600">ACTIVE BUILDER</text>
  </g>

  <!-- Right Side Decorative Radar Sweep -->
  <g transform="translate(800, 100)">
    <circle cx="60" cy="55" r="50" fill="#0A1026" stroke="#1E293B" stroke-width="1" />
    <circle cx="60" cy="55" r="35" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4, 4" opacity="0.5" />
    <circle cx="60" cy="55" r="20" fill="none" stroke="#FF2A5F" stroke-width="1" stroke-dasharray="2, 2" opacity="0.7" />
    
    <line x1="60" y1="55" x2="60" y2="10" stroke="#00F0FF" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 60 55" to="360 60 55" dur="5s" repeatCount="indefinite" />
    </line>

    <circle cx="60" cy="55" r="3" fill="#00F0FF" />
    <circle cx="75" cy="40" r="2.5" fill="#FF2A5F" class="status-dot" />
    <circle cx="45" cy="65" r="2" fill="#00F0FF" class="status-dot" />

    <text x="60" y="125" text-anchor="middle" fill="#64748B" font-size="9" class="mono-text" letter-spacing="1">RADAR // ACTIVE</text>
  </g>
</svg>
