      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="14" width="20" height="20" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1" />
