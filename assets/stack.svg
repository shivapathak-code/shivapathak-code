      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">NoSQL Document Store</text>
      <text x="198" y="28" fill="#47A248" font-size="9.5" text-anchor="end" font-weight="700" class="mono">BSON</text>
    </g>

    <!-- MySQL Badge -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <circle cx="23" cy="24" r="10" fill="#00758F" opacity="0.8" />
      <text x="23" y="27" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="mono">SQL</text>
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">MySQL</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Relational Schemas</text>
      <text x="198" y="28" fill="#F29111" font-size="9.5" text-anchor="end" font-weight="700" class="mono">RDBMS</text>
    </g>

    <!-- React Badge -->
    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <g transform="translate(13, 14)">
        <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(30 10 10)" />
        <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(90 10 10)" />
        <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(150 10 10)" />
        <circle cx="10" cy="10" r="1.8" fill="#61DAFB" />
      </g>
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">React</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Dynamic Component UI</text>
      <text x="198" y="28" fill="#61DAFB" font-size="9.5" text-anchor="end" font-weight="700" class="mono">JSX</text>
