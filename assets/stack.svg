      <circle cx="23" cy="24" r="9" fill="#46E3B7" opacity="0.9" />
      <text x="23" y="28" fill="#0B1228" font-size="10" font-weight="800" text-anchor="middle" class="mono">R</text>
      <text x="44" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Render</text>
      <text x="44" y="37" fill="#94A3B8" font-size="9" class="mono">Backend Web Services</text>
      <text x="214" y="28" fill="#46E3B7" font-size="9.5" text-anchor="end" font-weight="700" class="mono">CLOUD</text>
