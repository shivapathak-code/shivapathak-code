      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Express.js</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Web Routing &amp; Middleware</text>
      <text x="198" y="28" fill="#CBD5E1" font-size="9.5" text-anchor="end" font-weight="700" class="mono">APP</text>
