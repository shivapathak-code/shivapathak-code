      <path d="M 23 15 L 29 18 L 29 25 C 29 29 23 33 23 33 C 23 33 17 29 17 25 L 17 18 Z" fill="none" stroke="#D63AFF" stroke-width="1.5" />
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">JWT Auth</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Tokens &amp; Security</text>
      <text x="198" y="28" fill="#D63AFF" font-size="9.5" text-anchor="end" font-weight="700" class="mono">AUTH</text>
