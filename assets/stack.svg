      <circle cx="17" cy="18" r="2.5" fill="#F05032" />
      <circle cx="17" cy="30" r="2.5" fill="#F05032" />
      <circle cx="27" cy="22" r="2.5" fill="#F05032" />
      <line x1="17" y1="18" x2="17" y2="30" stroke="#F05032" stroke-width="1.5" />
      <path d="M 17 24 Q 22 24 27 22" fill="none" stroke="#F05032" stroke-width="1.5" />
      <text x="44" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Git &amp; GitHub</text>
      <text x="44" y="37" fill="#94A3B8" font-size="9" class="mono">Version Control &amp; Collab</text>
      <text x="214" y="28" fill="#F05032" font-size="9.5" text-anchor="end" font-weight="700" class="mono">VCS</text>
    </g>

    <!-- Postman Badge -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="226" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <circle cx="23" cy="24" r="10" fill="#FF6C37" />
      <text x="23" y="28" fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle" class="mono">&gt;</text>
      <text x="44" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Postman</text>
      <text x="44" y="37" fill="#94A3B8" font-size="9" class="mono">API Testing &amp; Docs</text>
      <text x="214" y="28" fill="#FF6C37" font-size="9.5" text-anchor="end" font-weight="700" class="mono">TEST</text>
    </g>

    <!-- Vercel & Netlify Badge -->
    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="226" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <polygon points="17,30 22,20 27,30" fill="#FFFFFF" />
      <text x="44" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Vercel &amp; Netlify</text>
      <text x="44" y="37" fill="#94A3B8" font-size="9" class="mono">Frontend &amp; Edge Cloud</text>
      <text x="214" y="28" fill="#00C7B7" font-size="9.5" text-anchor="end" font-weight="700" class="mono">HOST</text>
