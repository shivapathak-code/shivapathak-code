      <rect x="13" y="15" width="9" height="18" rx="2" fill="#E34F26" />
      <rect x="24" y="15" width="9" height="18" rx="2" fill="#1572B6" />
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">HTML &amp; CSS</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Modern Responsive Web</text>
      <text x="198" y="28" fill="#38BDF8" font-size="9.5" text-anchor="end" font-weight="700" class="mono">DOM</text>
