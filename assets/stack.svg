    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <rect x="12" y="13" width="22" height="22" rx="3" fill="#F7DF1E" />
      <text x="23" y="29" fill="#000000" font-size="12" font-weight="800" text-anchor="middle" class="sans">JS</text>
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">JavaScript</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">ES6+ &amp; Asynchronous</text>
      <text x="198" y="28" fill="#F7DF1E" font-size="9.5" text-anchor="end" font-weight="700" class="mono">V8</text>
    </g>
  </g>

  <!-- COLUMN 2: BACKEND -->
  <g transform="translate(254, 110)">
    <rect x="0" y="0" width="210" height="26" rx="5" fill="#0E172F" stroke="#1E293B" stroke-width="1" />
    <text x="10" y="17" fill="#38BDF8" font-size="10" font-weight="700" class="mono">02 // BACKEND</text>

    <!-- Node.js Badge -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <polygon points="23,13 32,18 32,30 23,35 14,30 14,18" fill="none" stroke="#68A063" stroke-width="1.8" />
      <circle cx="23" cy="24" r="3" fill="#68A063" />
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Node.js</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Non-blocking Runtime</text>
      <text x="198" y="28" fill="#68A063" font-size="9.5" text-anchor="end" font-weight="700" class="mono">RUN</text>
