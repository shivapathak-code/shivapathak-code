<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A15" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="stackBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#FF2A5F" />
    </linearGradient>

    <pattern id="stackGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="406" rx="14" fill="url(#stackBg)" stroke="url(#stackBorder)" stroke-width="1.6" />
  <rect x="3" y="3" width="954" height="404" rx="13" fill="url(#stackGrid)" />

  <!-- Top Header Section -->
  <g transform="translate(28, 20)">
    <rect x="0" y="0" width="260" height="22" rx="4" fill="#0D1630" stroke="#00F0FF" stroke-width="0.8" />
    <circle cx="12" cy="11" r="3.5" fill="#00F0FF" />
    <text x="24" y="15" fill="#00F0FF" font-size="10" font-weight="700" letter-spacing="1" class="mono">
      ENGINEERING TOOLKIT // STACK
    </text>

    <text x="0" y="52" fill="#FFFFFF" font-size="22" font-weight="800" class="sans" letter-spacing="-0.3">
      Categorized Technology Matrix
    </text>
    <text x="0" y="70" fill="#94A3B8" font-size="11.5" class="mono">
      Languages • Backend Architecture • Databases &amp; Frontend • Cloud Deployments
    </text>
  </g>

  <!-- Divider -->
  <line x1="28" y1="96" x2="932" y2="96" stroke="#1E293B" stroke-width="1" />

  <!-- COLUMN 1: PROGRAMMING -->
  <g transform="translate(28, 110)">
    <rect x="0" y="0" width="210" height="26" rx="5" fill="#0E172F" stroke="#1E293B" stroke-width="1" />
    <text x="10" y="17" fill="#00F0FF" font-size="10" font-weight="700" class="mono">01 // PROGRAMMING</text>

    <!-- Java Badge -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <g transform="translate(12, 12)">
        <path d="M 6 4 C 6 2, 14 2, 14 4 C 14 6, 6 8, 6 10 C 6 12, 14 14, 14 16" fill="none" stroke="#F89820" stroke-width="1.8" stroke-linecap="round" />
        <path d="M 10 4 C 10 2, 18 2, 18 4 C 18 6, 10 8, 10 10 C 10 12, 18 14, 18 16" fill="none" stroke="#5382A1" stroke-width="1.8" stroke-linecap="round" />
      </g>
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">Java</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Core &amp; OOP Concepts</text>
      <text x="198" y="28" fill="#F89820" font-size="9.5" text-anchor="end" font-weight="700" class="mono">JDK</text>
    </g>

    <!-- C Badge -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <circle cx="23" cy="24" r="11" fill="#00599C" opacity="0.9" />
      <text x="23" y="28" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle" class="mono">C</text>
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">C Language</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Procedural Foundations</text>
      <text x="198" y="28" fill="#38BDF8" font-size="9.5" text-anchor="end" font-weight="700" class="mono">ANSI</text>
