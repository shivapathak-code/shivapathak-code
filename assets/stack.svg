    <g transform="translate(0, 152)">
      <rect x="0" y="0" width="210" height="48" rx="7" fill="#0A0F22" stroke="#1E293B" stroke-width="1" />
      <circle cx="23" cy="24" r="11" fill="#004482" opacity="0.9" />
      <text x="23" y="28" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle" class="mono">C++</text>
      <text x="42" y="24" fill="#FFFFFF" font-size="13" font-weight="700" class="sans">C++</text>
      <text x="42" y="37" fill="#94A3B8" font-size="9" class="mono">Data Structures &amp; OOP</text>
      <text x="198" y="28" fill="#60A5FA" font-size="9.5" text-anchor="end" font-weight="700" class="mono">STL</text>
