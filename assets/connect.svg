<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A15" />
      <stop offset="60%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="connectBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A5F" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <pattern id="connectGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.35" />
    </pattern>
  </defs>

  <style>
    @keyframes signalPulse {
      0% { r: 10px; opacity: 1; }
      100% { r: 65px; opacity: 0; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .beacon {
      animation: beaconBlink 1.8s infinite ease-in-out;
    }
    .signal-1 {
      animation: signalPulse 3s infinite linear;
      transform-origin: 860px 120px;
    }
    .signal-2 {
      animation: signalPulse 3s infinite linear;
      animation-delay: 1.5s;
      transform-origin: 860px 120px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="236" rx="14" fill="url(#connectBg)" stroke="url(#connectBorder)" stroke-width="1.6" />
  <rect x="3" y="3" width="954" height="234" rx="13" fill="url(#connectGrid)" />

  <!-- Signal Radar on Right -->
  <g>
    <circle cx="860" cy="120" r="10" stroke="#00F0FF" stroke-width="1.5" fill="none" class="signal-1" />
    <circle cx="860" cy="120" r="10" stroke="#FF2A5F" stroke-width="1.5" fill="none" class="signal-2" />
    <circle cx="860" cy="120" r="16" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="860" cy="120" r="5" fill="#00F0FF" class="beacon" />
    <text x="860" y="160" text-anchor="middle" fill="#64748B" font-size="9" class="mono" letter-spacing="1">RADAR // RX</text>
  </g>

  <!-- Content Section -->
  <g transform="translate(36, 24)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#0D1630" stroke="#FF2A5F" stroke-width="0.8" />
    <circle cx="12" cy="11" r="3.5" fill="#FF2A5F" class="beacon" />
    <text x="24" y="15" fill="#FF2A5F" font-size="10" font-weight="700" letter-spacing="1" class="mono">
      HANDSHAKE // CONNECT
    </text>

    <text x="0" y="56" fill="#FFFFFF" font-size="24" font-weight="800" class="sans" letter-spacing="-0.3">
      Let's Connect &amp; Collaborate
    </text>
    <text x="0" y="78" fill="#94A3B8" font-size="12" class="mono">
      Open for full-stack projects, backend engineering roles, and system architecture discussions.
    </text>

    <!-- 3 Action Channels -->
    <g transform="translate(0, 104)">
      <!-- Channel 1: LinkedIn -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="225" height="54" rx="8" fill="#090E20" stroke="#0A66C2" stroke-width="1" />
        <circle cx="22" cy="27" r="10" fill="#0A66C2" />
        <text x="22" y="31" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle" class="sans">in</text>
        <text x="42" y="22" fill="#E2E8F0" font-size="11.5" font-weight="700" class="sans">LinkedIn</text>
        <text x="42" y="38" fill="#38BDF8" font-size="10" class="mono">shiva-pathak-46090b388</text>
      </g>

      <!-- Channel 2: Email -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="245" height="54" rx="8" fill="#090E20" stroke="#EA4335" stroke-width="1" />
        <circle cx="22" cy="27" r="10" fill="#EA4335" />
        <text x="22" y="31" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle" class="sans">@</text>
        <text x="42" y="22" fill="#E2E8F0" font-size="11.5" font-weight="700" class="sans">Direct Email</text>
        <text x="42" y="38" fill="#FF5577" font-size="10" class="mono">shivapathak766@gmail.com</text>
      </g>

      <!-- Channel 3: GitHub -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="220" height="54" rx="8" fill="#090E20" stroke="#00F0FF" stroke-width="1" />
        <circle cx="22" cy="27" r="10" fill="#0E1A38" />
        <text x="22" y="31" fill="#00F0FF" font-size="11" font-weight="800" text-anchor="middle" class="mono">&lt;&gt;</text>
        <text x="42" y="22" fill="#E2E8F0" font-size="11.5" font-weight="700" class="sans">GitHub Profile</text>
        <text x="42" y="38" fill="#00F0FF" font-size="10" class="mono">@shivapathak-code</text>
      </g>
    </g>
  </g>
</svg>
